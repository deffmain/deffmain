
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Checkout custom Snake implementation
        uses: actions/checkout@v4
        with:
          repository: jjceron/snk
          ref: feature/year-range
          path: .github/actions/snk-custom

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .github/actions/snk-custom

      - name: Build Snake
        run: |
          bun run build:lib
          bun run build:action
        working-directory: .github/actions/snk-custom

      - name: Generate contribution snake
        uses: ./.github/actions/snk-custom
        with:
          github_user_name: deffmain
          year: "2026"
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
